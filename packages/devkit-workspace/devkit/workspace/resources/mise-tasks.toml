["workspace:dprint:format"]
usage = '''
arg "[files]" var=#true default="." help="Files to format (defaults to the whole tree; lefthook passes staged files here)"
'''
run = "dprint fmt ${usage_files}"

["workspace:dprint:check"]
run = "dprint check"

["workspace:actionlint:check"]
run = "actionlint"

# repolish runs through DK_UVTB_REPOLISH_EXEC: provider repos that host
# their providers as project dependencies override it to "" (mise's
# uv_venv_auto puts the venv's repolish on PATH); consumer repos get the
# default "uv-toolbox exec -e repolish --" from the env defaults.
["workspace:repolish:apply"]
run = '{{ env.DK_UVTB_REPOLISH_EXEC }} repolish apply'

["workspace:repolish:check"]
run = '{{ env.DK_UVTB_REPOLISH_EXEC }} repolish apply --check'

["workspace:repolish:link"]
run = '{{ env.DK_UVTB_REPOLISH_EXEC }} repolish link'

["workspace:docs:dev"]
run = "zensical serve --dev-addr=127.0.0.1:8000 --open"

["workspace:docs:build"]
run = "zensical build --clean"
