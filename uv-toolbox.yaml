venv_path: .uv-toolbox

# No "repolish" env here: devkit hosts its own providers as workspace
# members, so repolish comes from the project venv (see DK_UVTB_REPOLISH_EXEC
# in mise.toml). The "tools" env stays toolbox-managed.
environments:
  - name: tools
    dependencies:
      - ruff==0.15.20
      - complexipy==6.0.1
      - zensical==0.0.47
      - releez==1.0.1
