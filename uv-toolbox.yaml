      # facets release ships.
      -e /home/jmlopez/Work/repolish
      -e ./packages/devkit-workspace
      -e ./packages/devkit-python
      -e ./packages/devkit-releez
    executables:
      - repolish
      - devkit-workspace-link
      - devkit-python-link
      - devkit-releez-link
