environments:
  - name: tools
    requirements: |
      ruff==0.15.20
      complexipy==6.0.1
      zensical==0.0.47
      releez==1.0.1
  - name: repolish
    requirements: |
      # TEMPORARY: provider facets only exist on repolish's unreleased
      # topic/facets-recreate branch, so the sibling checkout is installed
