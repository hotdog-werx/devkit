name: deploy-docs

on:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  check-docs:
    runs-on: ubuntu-latest
    outputs:
      has-docs: ${{ steps.check-docs.outputs.has-docs }}
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: check-docs-folder
        id: check-docs
        shell: bash
        run: |
          HAS_DOCS=$([ -f "zensical.toml" ] && echo "true" || echo "false")
          echo "has-docs=$HAS_DOCS" >> "$GITHUB_OUTPUT"

  build-and-deploy:
    needs: check-docs
    if: needs.check-docs.outputs.has-docs == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: setup-uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: '**/pyproject.toml'
      - name: mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      - name: dependencies
        run: mise run python:uv-sync
      - name: build-docs
        run: mise run workspace:docs:build
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: './site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
