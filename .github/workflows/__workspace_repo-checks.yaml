name: repo-checks

on:
  workflow_call:
    inputs:
      enable-docs:
        description: 'Whether to run the build-docs step'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: setup-uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: '**/pyproject.toml'
      - name: mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      - name: dependencies
        run: mise run python:uv-sync
      - name: check-dprint
        if: always() && !cancelled()
        run: mise run workspace:dprint:check
      - name: check-actionlint
        if: always() && !cancelled()
        run: mise run workspace:actionlint:check
      - name: check-repolish
        if: always() && !cancelled()
        run: mise run workspace:repolish:check
      - name: check-uv-toolbox-lock
        if: always() && !cancelled()
        run: mise run workspace:uv-toolbox-lock:check
      - name: build-docs
        if: inputs.enable-docs && always() && !cancelled()
        run: mise run workspace:docs:build
