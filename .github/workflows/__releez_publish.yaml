name: releez-publish

on:
  workflow_call:
    inputs:
      use-self-action:
        description: 'Use the local ./ action instead of the published hotdog-werx/releez action — for releez to dogfood itself'
        type: boolean
        default: false
      build-command:
        description: 'Command used to build publishable distributions'
        type: string
        default: uv build --no-sources
      publish-command:
        description: 'Command used to publish the built package'
        type: string
        default: uv publish dist/*
      publish-package:
        description: 'Whether to build and publish a package to PyPI. Set false for repos with no single installable root package (e.g. a bare workspace container) — the tag/changelog/GitHub Release steps still run.'
        type: boolean
        default: true
      package-prefix:
        description: 'Prefix added to a monorepo project ID to form its Python distribution name.'
        type: string
        default: ''
    secrets:
      PYPI_PUBLISH_TOKEN:
        required: false

permissions:
  contents: write

jobs:
  publish:
    name: Finalize release
    runs-on: ubuntu-latest
    if: >
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/')
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install mise tools
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      # `uses:` can't reference an expression — it must be a static string —
      # so selecting between the published action and the local self-action
      # needs two mutually-exclusive steps instead of one dynamic uses:.
      - name: Releez finalize (published action)
        id: releez-published
        if: '!inputs.use-self-action'
        uses: hotdog-werx/releez@db0a71d48b9c39f6d7dc415d01f0b6ad21a7ecce # 1.1.1
        with:
          mode: finalize

      - name: Releez finalize (self action)
        id: releez-self
        if: inputs.use-self-action
        uses: ./
        with:
          mode: finalize

      - name: Set build version
        if: inputs.publish-package
        env:
          PACKAGE_PREFIX: ${{ inputs.package-prefix }}
          PROJECT: ${{ steps.releez-published.outputs.project || steps.releez-self.outputs.project }}
          VERSION: ${{ steps.releez-published.outputs.pep440-version || steps.releez-self.outputs.pep440-version }}
        run: |
          if [ -n "$PROJECT" ]; then
            uv version --package "${PACKAGE_PREFIX}${PROJECT}" "$VERSION" --frozen
          else
            uv version "$VERSION" --frozen
          fi

      - name: Build package
        if: inputs.publish-package
        env:
          PACKAGE_PREFIX: ${{ inputs.package-prefix }}
          PROJECT: ${{ steps.releez-published.outputs.project || steps.releez-self.outputs.project }}
        run: ${{ inputs.build-command }}

      - name: Publish to PyPI
        if: inputs.publish-package
        env:
          UV_PUBLISH_URL: ${{ vars.PYPI_PUBLISH_URL }}
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_PUBLISH_TOKEN }}
        run: ${{ inputs.publish-command }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.releez-published.outputs.release-version || steps.releez-self.outputs.release-version }}
          RELEASE_NOTES: ${{ steps.releez-published.outputs.release-notes || steps.releez-self.outputs.release-notes }}
        run: |
          notes_file="$RUNNER_TEMP/releez-release-notes.md"
          printf '%s\n' "$RELEASE_NOTES" > "$notes_file"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "$RELEASE_TAG" \
              --notes-file "$notes_file"
          else
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --title "$RELEASE_TAG" \
              --notes-file "$notes_file"
          fi
