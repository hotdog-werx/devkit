[settings]
experimental = true
python.uv_venv_auto = true

[env]
GITHUB_REPO_OWNER = "hotdog-werx"
GITHUB_REPO_NAME = "{{ config_root | basename }}"
GITHUB_REPO = "{{ env.GITHUB_REPO_OWNER }}/{{ env.GITHUB_REPO_NAME }}"
GIT_CLIFF_CONFIG = "./cliff.toml"
# devkit is a bare uv workspace container (package = false, no
# [tool.uv.build-backend] module-name) — python:check:coverage's normal
# auto-detection would fall back to the wrong target, so it's set
# explicitly here instead.
PYTEST_COV_TARGET = "devkit"
# devkit hosts its own providers as workspace members, so repolish comes
# from the project venv (a dependency of the members) instead of a
# uv-toolbox env: the task templates' DK_UVTB_REPOLISH_EXEC prefix is
# overridden to empty, and mise's uv_venv_auto puts repolish on PATH.
# The uv-toolbox form stays the default for consumer repos.
DK_UVTB_REPOLISH_EXEC = ""
# complexipy and zensical live only in the uv-toolbox "tools" env (no
# pipx duplicates in [tools] below), so the tasks that call them route
# through the same variable consumer repos get from default.env.
DK_UVTB_TOOLS_EXEC = "uv-toolbox exec -e tools --"

[tools]
uv = "0.11.26"
dprint = "0.55.1"
starship = "1.26.0"
git-cliff = "2.13.1"
actionlint = "1.7.11"
shellcheck = "0.11.0"

"pipx:uv-toolbox" = "0.4.1"
"pipx:ruff" = "0.14.14"
"pipx:ty" = "0.0.59"
"pipx:pydoclint" = "0.9.1"
"pipx:releez" = "1.1.1"
# complexipy and zensical are NOT here: they live in the uv-toolbox
# "tools" env and tasks call them through DK_UVTB_TOOLS_EXEC, so there
# is one version of each tool, not two drifting apart.

# `mise install` (locally, and in CI through mise-action) runs the pieces
# every environment needs: the uv-toolbox envs, the repolish resource
# links (the .editorconfig/dprint.json symlinks are never committed —
# their source is an absolute path, portable only within the machine
# that created it — so every environment links them fresh, which is what
# keeps workspace:dprint:check working on a fresh runner), and the
# setup-hook gate.
#
# The full `setup` (uv sync, pnpm) deliberately does NOT run in CI:
# workflow jobs run their own targeted steps (python checks run
# python:uv-sync themselves, the docs job has no Python to sync at all),
# so syncing there is wasted work. setup stays a local convenience, and
# it's up to the providers to decide what it does — the hook only
# guarantees the common denominator.
[[hooks.postinstall]]
run = "mise run workspace:uv-toolbox-install"

[[hooks.postinstall]]
run = "mise run repolish-link"

[[hooks.postinstall]]
run = "mise run workspace:setup-hook"

# mise loads task_config includes when its config loads — on a fresh
# clone that happens before the postinstall hooks have run `repolish
# link`, so task files are included straight from each package's
# resources/ instead of through the `.repolish/devkit-<name>/` symlink
# a real consumer would use. "mise-tasks" (the default) is kept
# explicitly — task_config includes *replaces* the default file-task
# dirs rather than adding to them.
[task_config]
includes = [
  "mise-tasks",
  "packages/devkit-workspace/devkit/workspace/resources/mise-tasks",
  "packages/devkit-workspace/devkit/workspace/resources/mise-tasks.toml",
  "packages/devkit-python/devkit/python/resources/mise-tasks",
]

[tasks.format]
depends = ["python:format", "workspace:dprint:format"]

# The provider-repo link task. Consumer repos' workspace:repolish:link
# runs repolish from the uv-toolbox env (installed by the hook's first
# entry); devkit's repolish comes from the project venv, and `uv run
# --all-packages` provisions that venv first — so the link works on a
# fresh clone before setup has synced anything.
[tasks.repolish-link]
description = "link repolish provider resources (venv-provisioned)"
run = "uv run --all-packages repolish link"

# Local-only full environment (workspace:setup-hook skips it in CI):
# what runs here is the providers' decision — devkit has Python, so it
# syncs the workspace venv; a docs-only repo's setup would skip uv-sync
# entirely.
[tasks.setup]
depends = ["python:uv-sync", "workspace:pnpm-install"]
run = "echo Ready!"

[tasks.ci-checks]
depends = [
  "workspace:dprint:check",
  "python:check:ruff",
  "python:check:ty",
  "python:check:complexity",
  "python:check:pydoclint",
  "python:check:coverage",
  "workspace:actionlint:check",
  "workspace:repolish:check",
]

[tasks.repo-checks]
depends = [
  "workspace:dprint:check",
  "workspace:actionlint:check",
  "workspace:repolish:check",
  "workspace:uv-toolbox-lock:check",
]
